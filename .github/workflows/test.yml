# 测试。推代码与提 PR 时跑，不参与发布 —— 发布走 release.yml，
# 由标签触发，这里失败不会挡住发版。
#
# 为什么一定要在 CI 上跑 PostgreSQL：本地开发用的是 SQLite，而两者并不等价。
# 取任务的 FOR UPDATE SKIP LOCKED 在 SQLite 上根本不存在，账号表的分区
# （accounts 按 shard 切成 64 个 LIST 分区）也是 PostgreSQL 独有的 ——
# 分区键、唯一约束、序列续号这些只有在真实 PostgreSQL 上跑过才算验证过。
# 只跑 SQLite 的绿灯说明不了生产没问题。
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outlook_test
        ports: ['5432:5432']
        # 没有健康检查的话，测试会在数据库还没起来的时候就开始连。
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # 先跑 SQLite：本地开发与小规模部署就是这个形态，它必须一直是绿的。
      - name: 测试 (SQLite)
        working-directory: backend
        run: go test ./...

      # 再跑 PostgreSQL：每个用例一个独立 schema，用完即删，可以并行。
      - name: 测试 (PostgreSQL)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/outlook_test?sslmode=disable
        run: go test -count=1 ./...

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 代码检查
        working-directory: frontend
        run: npm run lint

      - name: 构建
        working-directory: frontend
        run: npm run build

  responsive:
    name: 响应式检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 检查跑在真实产物上：前端嵌进 Go 二进制，单端口托管，
      # 与生产完全一致。用 vite dev 跑虽然快，但那不是用户会看到的东西。
      - name: 构建前端并嵌进后端
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          rm -rf backend/web/dist
          cp -R frontend/dist backend/web/dist
          touch backend/web/dist/.gitkeep

      - name: 启动服务
        run: |
          cd backend
          CGO_ENABLED=0 go build -o /tmp/api .
          DATABASE_URL="sqlite:///tmp/ui.db" \
          APP_ADDR=127.0.0.1:8081 \
          APP_ENV=dev \
          MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
          ENV_FILE=/dev/null \
          /tmp/api > /tmp/api.log 2>&1 &
          # 等端口就绪，别用固定 sleep —— 机器忙的时候会不够
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8081/healthz

      # 空页面照不出版式问题：表格没有行、标签没有长度。
      # 灌的数据里刻意掺了超长邮箱与超长备注 —— 那才是把布局顶坏的内容。
      # 必须排在灌数据之前：一旦灌了，空态就再也回不来了。
      # 而空态正是新用户看到的第一屏 —— 装完、登录、落在总览，
      # 那一刻整个产品只有空态。这一整类页面此前一次都没被检查过。
      - name: 空态检查（灌数据之前）
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:8081
          OUT_DIR: /tmp/empty-shots
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          PASS=$(grep -o '"password":"[^"]*"' /tmp/api.log | head -1 | cut -d'"' -f4)
          echo "::add-mask::$PASS"
          ADMIN_PASS="$PASS" npm run check:empty

      - name: 灌入测试数据
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:8081
        run: |
          PASS=$(grep -o '"password":"[^"]*"' /tmp/api.log | head -1 | cut -d'"' -f4)
          echo "::add-mask::$PASS"
          ADMIN_PASS="$PASS" npm run seed:responsive

      - name: 响应式检查
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:8081
          OUT_DIR: /tmp/responsive-shots
          # runner 镜像预装了 Chrome，不必再下载 playwright 自带的那份
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          PASS=$(grep -o '"password":"[^"]*"' /tmp/api.log | head -1 | cut -d'"' -f4)
          echo "::add-mask::$PASS"
          ADMIN_PASS="$PASS" npm run check:responsive

      # 失败时把截图带出来。光看一行"某某越界"很难判断到底歪成什么样。
      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-shots
          # 两处都带上：空态那一步失败时，截图同样是唯一能看清现场的东西。
          path: |
            /tmp/responsive-shots
            /tmp/empty-shots
          retention-days: 7

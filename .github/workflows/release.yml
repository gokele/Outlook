# 发布。推一个 v 开头的标签即触发，产物直接进 GitHub Release，
# 应用里的「在线更新」面板随后就能看到并一键装上。
#
# 资产命名必须带 <GOOS>-<GOARCH>：更新器就是靠这段字符串挑出适配当前
# 机器的那一个（internal/updater 的 Latest）。名字对不上，用户会在
# arm 机器上装到 amd64 的包，而错误要到下一次启动才暴露，离现场很远。
#
# checksums.txt 不是可选项：更新决定服务器下一刻运行什么代码，
# 缺它的发布会被更新器直接拒绝。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，如 v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: 构建与发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 取全部历史，下面要按上一个标签生成变更列表
          fetch-depth: 0

      - name: 解析版本号
        id: ver
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -z "$tag" ] && tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "发布版本 $tag"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 构建前端
        working-directory: frontend
        run: npm ci && npm run build

      - name: 前端产物拷进 go:embed 目录
        run: |
          rm -rf backend/web/dist
          cp -R frontend/dist backend/web/dist
          # .gitkeep 要留着，仓库里靠它保证目录存在
          touch backend/web/dist/.gitkeep
          ls -la backend/web/dist

      # 交叉编译。pgx 与 modernc.org/sqlite 都是纯 Go，
      # CGO_ENABLED=0 就能从 ubuntu 直接编出各平台的静态二进制。
      - name: 交叉编译
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p ../release
          build() {
            goos=$1; goarch=$2; ext=$3
            out="../release/api-${goos}-${goarch}${ext}"
            echo "==> $out"
            GOOS=$goos GOARCH=$goarch go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "$out" .
          }
          build linux   amd64 ''
          build linux    arm64 ''
          build windows amd64 '.exe'
          build windows arm64 '.exe'

      - name: 生成校验和
        working-directory: release
        run: |
          # 必须在产物目录内执行：sha256sum 会把路径原样写进文件，
          # 带上目录前缀就与 Release 里的资产名对不上了。
          sha256sum api-* > checksums.txt
          cat checksums.txt

      # 发布说明取自仓库里的 CHANGELOG.md，而不是在这里拼文案。
      # 内容随代码一起提交、一起评审，发布时只是把对应小节抄出来 ——
      # 构建期临时生成的说明没人看过，很容易与实际改动对不上。
      - name: 抽取发布说明
        id: notes
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          # 取 "## <tag>" 到下一个 "## " 之间的内容
          awk -v tag="$tag" '
            $0 == "## " tag { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md 里没有 $tag 的小节，将回退到自动生成"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi
          cat notes.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          # CHANGELOG 里没写这一版时才退回自动生成，保证发布不会没有说明
          generate_release_notes: ${{ steps.notes.outputs.fallback == 'true' }}
          files: |
            release/api-*
            release/checksums.txt
